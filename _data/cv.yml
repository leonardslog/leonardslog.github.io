- title: Experience
  type: time_table
  contents:
    - title: Bonderman Travel Fellow
      institution: University of Washington
      year: 2024.06 - 2025.03
      description: Awarded highly competitive fellowship to support eight months of independent international travel across nine countries in three distinct geographic regions.
    - title: National Science Foundation Postdoctoral Fellow
      institution: University of Michigan, Ann Arbor, Michigan, USA
      year: 2022.06 - 2024.06
      description:
        - Developed statistical models that account for both discrete and continuous spatial variation in admixture detection.
        - Constructed an evolutionary simulation framework to test the efficacy of widely used geospatially agnostic methods for population structure inference under complex evolutionary histories.
    - title: Research Associate
      institution: Michigan State University
      year: 2021.01 - 2022.05
      description: Conducted meta-analysis that identified perpetuation of bias in peer-review pipelines within Ecology and Evolution journals.
    - title: Graduate Student Researcher
      institution: University of Washington
      year: 2013.09 - 2020.12
      description:
        - Conducted multi-year field research and specimen collection for deposition in museum collections, NGS library preparation, and data analysis for research on evolution in nonmodel systems. Communicated complex research topics to broad audiences across the knowledge spectrum, including the general public, community leaders, and industry stakeholders.
        - Developed and taught lectures, discussions, and lab sections in introductory biology, evolution, advanced animal physiology, advanced cell biology, and evolutionary medicine
    - title: Research Technician, Lehmann Lab
      institution: Skirball Institute of Biomolecular Medicine
      year: 2009.09 - 2013.05
      description: 
        - Conducted enhancer/suppressor genetic screen to identify candidate disruptors of germ cell development in <i>Drosophila melanogaster</i>
        - Developed cDNA library to examine conservation of spatial and temporal control mechanisms of germ-plasm RNA localization across <i>Drosophila</i> species
        - Transgenic <i>Drosophila</i> stock maintenance and loan preparation

